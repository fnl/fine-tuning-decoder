# Smoke run: prove training, masking, checkpointing and evaluation end to end (DESIGN §7, §9).
# Milestone 4 changes values only: model, adapter, name, tags, batch sizes, and omits the subsets.
name: qwen3-0.6b-smoke
tags: [smoke, qlora]
model: Qwen/Qwen3-0.6B
dataset: fnl-es/muc4-chat
adapter: fnl-es/qwen3-0.6b-muc4-lora-smoke
train_docs: 100              # first N documents; absent = the whole split
dev_docs: 50
max_seq_len: 2048            # sequence budget; longer training examples are dropped and counted
epochs: 3
lr: 2.0e-4
scheduler: cosine
warmup_ratio: 0.03
effective_batch_size: 16     # gradient accumulation = effective / per-device
per_device_batch_size: 2
seed: 3407
quantization: nf4            # nf4 | none; the compute dtype is detected from the GPU
lora:
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
eval_every: 0.5              # epochs; drives evaluation *and* checkpointing
generation:
  max_new_tokens: 512
  batch_size: 16
wandb_project: muc4-event-extraction
