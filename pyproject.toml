[project]
name = "fine-tuning-decoder"
version = "0.1.0"
description = "Fine-tune a small decoder LLM for document-level event extraction on MUC-4"
requires-python = ">=3.11,<3.13"
dependencies = [
    "transformers>=4.51",
    "tokenizers",
    "jinja2",
    "datasets>=3.0",
    "huggingface-hub",
    "pyyaml",
    "wandb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout without a top-level package: `data` and `eval` import directly (DESIGN §3)
sources = ["src"]
only-include = ["src/data", "src/eval.py"]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tokenizer: needs the Qwen tokenizer from the HF Hub (deselect with -m 'not tokenizer')",
]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["transformers.*", "datasets.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
extend-exclude = ["tests/oracle", "notebooks"]

[tool.ruff.lint]
extend-select = ["I"]
